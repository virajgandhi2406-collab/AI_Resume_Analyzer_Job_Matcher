services:
  - type: web
    name: resumepulse-ai
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEFAULT_AI_PROVIDER
        value: auto
      - key: SECRET_KEY
        generateValue: true
